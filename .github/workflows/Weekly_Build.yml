name: Manual Build

# 触发器：仅保留手动触发
on:
  workflow_dispatch:
    inputs:
      build_title:
        description: "Build Note"
        required: false
        default: "SmsForwarder Custom Build"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 JDK 11 环境
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk

      # 3. 启用 Gradle 缓存（加快后续构建速度）
      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. 编译打包 Release APK
      - name: Build with Gradle
        run: bash ./gradlew assembleRelease

      # 5. 查找生成的 APK 路径（兼容 build/app 和 app/build 两种输出目录）
      - name: Find APK files
        run: |
          echo "=== Searching for generated APKs ==="
          find "${{ github.workspace }}" -name "*.apk"

      # 6. 上传所有生成的 APK 到 GitHub Actions Artifacts 供下载
      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-Release-APKs
          path: |
            **/build/**/outputs/apk/**/release/*.apk
            **/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
